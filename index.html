<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking-Practice Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Lexend', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            overflow-x: hidden;
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: clamp(2.25rem, 6vw, 4.5rem);
            font-weight: 900;
            color: #2563eb;
            letter-spacing: -0.04em;
            text-align: center;
            margin: 0 0 0.5rem;
        }

        .subtitle {
            font-size: clamp(1.25rem, 3vw, 1.875rem);
            font-weight: 700;
            font-style: italic;
            color: #1f2937;
            margin: 0 0 2.5rem;
            text-align: center;
        }

        /* Cluster grid: 4 columns on laptops, 3 on tablets, 2 on phones */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.25rem 1rem;
            width: 100%;
            max-width: 72rem;
        }
        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 560px)  { .grid { grid-template-columns: repeat(2, 1fr); } }

        .card { position: relative; }

        /* Cluster button: shows a small arrow and stays "pressed" while open */
        .btn-cluster .arrow {
            display: inline-block;
            margin-left: 0.4rem;
            font-size: 0.8em;
            transition: transform 0.15s ease-in-out;
        }
        .btn-cluster[aria-expanded="true"] {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #000;
        }
        .btn-cluster[aria-expanded="true"] .arrow { transform: rotate(180deg); }

        /* Panel with the activities of the open cluster; spans the full row below it */
        .panel {
            grid-column: 1 / -1;
            position: relative;
            border: 3px solid #000;
            border-radius: 1.5rem;
            box-shadow: 6px 6px 0 #000;
            padding: 1.25rem 1.25rem 1.5rem;
            background: color-mix(in srgb, var(--panel-color, #fff) 22%, #fff);
        }
        .panel[hidden] { display: none; }
        /* Tail pointing up at the open cluster; its left offset is set from JS */
        .panel::before, .panel::after {
            content: "";
            position: absolute;
            left: var(--tail-x, 50%);
            transform: translateX(-50%);
            border: 12px solid transparent;
        }
        .panel::before { top: -27px; border-bottom-color: #000; }
        .panel::after  { top: -21px; border-bottom-color: color-mix(in srgb, var(--panel-color, #fff) 22%, #fff); }
        .panel h2 {
            margin: 0 0 1rem;
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            font-weight: 900;
        }
        .panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
            gap: 1.25rem 1rem;
        }
        @media (max-width: 560px) { .panel-grid { grid-template-columns: 1fr 1fr; } }
        .btn-activity { font-size: clamp(1rem, 1.8vw, 1.3rem); padding: 1.1rem 0.8rem; }

        .btn-main {
            width: 100%;
            font-family: inherit;
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            font-weight: 900;
            color: #000;
            padding: 1.5rem 1rem;
            border: 3px solid #000;
            border-radius: 1.5rem;
            box-shadow: 0 6px 0 #000;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
        }
        .btn-main:hover { filter: brightness(1.1); }
        .btn-main:active { transform: translateY(3px); box-shadow: 0 3px 0 #000; }
        .btn-main:focus-visible { outline: 4px solid #2563eb; outline-offset: 3px; }

        /* Info icon: opens the bubble on touch screens (also works with a mouse) */
        .info-btn {
            position: absolute;
            top: -0.6rem;
            right: -0.6rem;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            border: 3px solid #000;
            background: #fff;
            font-family: Georgia, serif;
            font-size: 1.15rem;
            font-weight: 700;
            font-style: italic;
            cursor: pointer;
            z-index: 2;
        }
        .info-btn:focus-visible { outline: 4px solid #2563eb; outline-offset: 2px; }

        /* Floating speech bubble */
        .bubble {
            position: absolute;
            z-index: 10;
            width: min(22rem, calc(100vw - 2rem));
            background: #fff;
            border: 3px solid #000;
            border-radius: 1.25rem;
            box-shadow: 6px 6px 0 #000;
            padding: 1rem 1.1rem;
            display: none;
        }
        .bubble.open { display: block; }
        /* Tail of the bubble; its left offset is set from JS to point at the button */
        .bubble::before, .bubble::after {
            content: "";
            position: absolute;
            left: var(--tail-x, 50%);
            transform: translateX(-50%);
            border: 12px solid transparent;
        }
        .bubble.below::before { top: -27px; border-bottom-color: #000; }
        .bubble.below::after  { top: -21px; border-bottom-color: #fff; }
        .bubble.above::before { bottom: -27px; border-top-color: #000; }
        .bubble.above::after  { bottom: -21px; border-top-color: #fff; }

        .bubble h2 { margin: 0 0 0.4rem; font-size: 1.35rem; font-weight: 900; }
        .bubble p  { margin: 0 0 0.75rem; font-size: 1.05rem; line-height: 1.4; }
        .bubble .cluster-tag { margin: 0 0 0.15rem; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #475569; }
        .bubble ul { margin: -0.25rem 0 0.75rem; padding-left: 1.2rem; font-size: 0.95rem; line-height: 1.35; }
        .bubble .level {
            display: inline-block;
            font-weight: 900;
            font-size: 1rem;
            background: #000;
            color: #fde047;
            padding: 0.2rem 0.6rem;
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .tutorial-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 900;
            background: #ef4444;
            color: #fff;
            border: 3px solid #000;
            border-radius: 0.75rem;
            box-shadow: 0 4px 0 #000;
            padding: 0.5rem 0.9rem;
            cursor: pointer;
        }
        .tutorial-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }

        /* Short message for fake doors */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 1.5rem;
            transform: translateX(-50%);
            max-width: calc(100vw - 2rem);
            background: #000;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 0.9rem 1.4rem;
            border-radius: 1rem;
            z-index: 20;
            display: none;
            text-align: center;
        }
        .toast.show { display: block; }
    </style>
</head>
<body>

    <div class="app">
        <!-- SCREEN 1: WELCOME -->
        <h1>Speaking-Practice Center</h1>
        <p class="subtitle">Choose the type of activity here</p>
        <div id="activity-grid" class="grid"></div>
    </div>

    <div id="bubble" class="bubble" role="tooltip"></div>
    <div id="toast" class="toast" role="status"></div>

    <script>
        // Clusters, activities, CEFR levels and bubble texts come from
        // "Definición Actividades_SPC_Homepage - ESTRUCTURA.docx" (Claudio, 2026-11-15).
        // Set available: true on an activity once its next screen exists.
        const CLUSTERS = [
            { name: "Interview", color: "#22d3ee", activities: [
                { name: "Prepared", level: "A2–B1",
                  text: "Students are given the purpose of the interview, and are given time to prepare questions." },
                { name: "Spontaneous", level: "B1+",
                  text: "Students are given the purpose of the interview, and are prompted with a sequence of different aspects of that context." }
            ]},
            { name: "True/False", color: "#c084fc", activities: [
                { name: "Trivia", level: "B1+",
                  text: "Students are given true or false world facts, and a text with a justification. The others have turns and time to make questions. Then vote to decide. Points are given to the ones who get it right, or the fact reader if no one gets it." },
                { name: "Hot seat", level: "A2+",
                  text: "One student makes a short statement and the class asks as many questions as possible. The others have turns and time to make questions. Then vote to decide. Points are given to the ones who get it right, or the fact reader if no one gets it." },
                { name: "Truth and lies", level: "A2+",
                  text: "Each group tells three stories, only one true; the class asks questions to find it. Then vote to decide. Points are given to the ones who get it right, or the fact reader if no one gets it." }
            ]},
            { name: "Pictures", color: "#fbbf24", activities: [
                { name: "Differences", level: "A1+",
                  text: "Pairs have two similar pictures and find the differences without looking at each other's. They speak them into their mics to show them on the teacher's console.",
                  notes: ["Pictures change in a sequence."] },
                { name: "Description", level: "A1+",
                  text: "Teams say as many sentences as they can about a picture in two minutes. They speak them into their mics to show them on the teacher's console.",
                  notes: ["Pictures change in a sequence."] }
            ]},
            { name: "Discussion", color: "#38bdf8", activities: [
                { name: "Things in common", level: "A1+",
                  text: "Pairs talk to discover as many things in common as they can." },
                { name: "I'd rather", level: "A2+",
                  text: "Students express and explain their preferences between two options.",
                  notes: ["Teachers can enter options or use bank."] },
                { name: "Debate", level: "B1+",
                  text: "A formal activity where teams defend opposing views on a controversial topic: first they plan as a team, then they interact with the other team." },
                { name: "Giving Opinions", level: "B1+",
                  text: "An exchange of ideas on specific prompts (topics, statements, questions, etc.) in small groups or with the whole class.",
                  notes: ["A moderator role is optional."] }
            ]},
            { name: "Problem Solving", color: "#a3e635", activities: [
                { name: "Decision making", level: "B1+",
                  text: "Students work together to find a solution to a dilemma or a hypothetical situation." },
                { name: "Ranking", level: "A1+",
                  text: "A discussion where students put a list of items in order of importance or preference." },
                { name: "Planning", level: "B1+",
                  text: "Groups plan something together, such as a holiday on a budget." },
                { name: "Item selection", level: "A2+",
                  text: "Students choose a limited number of items from a list and justify their choice." }
            ]},
            { name: "Story telling", color: "#f472b6", activities: [
                { name: "Hero's Journey", level: "B1+",
                  text: "Students are prompted on the creation of a story stage by stage." }
            ]},
            // Fake door: more clusters later
            { name: "More...", color: "#fef08a" }
        ];

        const grid = document.getElementById('activity-grid');
        const bubble = document.getElementById('bubble');
        const toast = document.getElementById('toast');
        let openCard = null;      // activity card whose bubble is open
        let openCluster = null;   // index of the open cluster
        let hideTimer = null;
        let toastTimer = null;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ---------- Bubbles (one per specific activity) ----------

        function fillBubble(cluster, activity) {
            bubble.innerHTML = '';
            const tag = document.createElement('p');
            tag.className = 'cluster-tag';
            tag.textContent = cluster.name;
            const title = document.createElement('h2');
            title.textContent = activity.name;
            const text = document.createElement('p');
            text.textContent = activity.text;
            bubble.append(tag, title, text);
            if (activity.notes) {
                const list = document.createElement('ul');
                activity.notes.forEach(n => {
                    const li = document.createElement('li');
                    li.textContent = n;
                    list.appendChild(li);
                });
                bubble.appendChild(list);
            }
            const level = document.createElement('div');
            level.className = 'level';
            level.textContent = 'Suggested CEFR level: ' + activity.level;
            // Fake door: the quick YouTube tutorial does not exist yet
            const tutorial = document.createElement('button');
            tutorial.className = 'tutorial-btn';
            tutorial.innerHTML = '<span aria-hidden="true">▶</span> Quick tutorial';
            tutorial.onclick = () => showToast('Video tutorial coming soon!');
            bubble.append(level, tutorial);
        }

        function positionBubble(card) {
            const r = card.getBoundingClientRect();
            const width = bubble.offsetWidth;
            const margin = 16;
            let left = r.left + r.width / 2 - width / 2;
            left = Math.max(margin, Math.min(left, window.innerWidth - width - margin));

            // Show below the button unless there is no room; then show above
            const spaceBelow = window.innerHeight - r.bottom;
            const below = spaceBelow > bubble.offsetHeight + 24 || r.top < bubble.offsetHeight + 24;
            bubble.classList.toggle('below', below);
            bubble.classList.toggle('above', !below);
            const top = below ? r.bottom + 18 : r.top - bubble.offsetHeight - 18;

            bubble.style.left = (left + window.scrollX) + 'px';
            bubble.style.top = (top + window.scrollY) + 'px';
            bubble.style.setProperty('--tail-x', (r.left + r.width / 2 - left) + 'px');
        }

        function openBubble(card, cluster, activity) {
            clearTimeout(hideTimer);
            fillBubble(cluster, activity);
            bubble.classList.add('open');
            positionBubble(card);
            openCard = card;
        }

        function closeBubble() {
            bubble.classList.remove('open');
            openCard = null;
        }

        function closeSoon() {
            clearTimeout(hideTimer);
            hideTimer = setTimeout(closeBubble, 200);
        }

        function makeActivityCard(cluster, activity) {
            const card = document.createElement('div');
            card.className = 'card';

            const btn = document.createElement('button');
            btn.className = 'btn-main btn-activity';
            btn.style.backgroundColor = cluster.color;
            btn.textContent = activity.name;
            btn.onclick = () => {
                if (activity.available) showToast('Next step: the Scenarios screen (in progress).');
                else showToast('Coming soon!');
            };
            card.appendChild(btn);

            const info = document.createElement('button');
            info.className = 'info-btn';
            info.textContent = 'i';
            info.setAttribute('aria-label', 'About ' + activity.name);
            info.onclick = (e) => {
                e.stopPropagation();
                if (openCard === card) closeBubble();
                else openBubble(card, cluster, activity);
            };
            card.appendChild(info);

            // Mouse: open on hover. Keyboard: open on focus.
            card.addEventListener('pointerenter', (e) => {
                if (e.pointerType !== 'touch') openBubble(card, cluster, activity);
            });
            card.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') closeSoon(); });
            btn.addEventListener('focus', () => openBubble(card, cluster, activity));
            btn.addEventListener('blur', closeSoon);
            return card;
        }

        // ---------- Clusters (each one unfolds its activities) ----------

        const panel = document.createElement('section');
        panel.className = 'panel';
        panel.id = 'cluster-panel';
        panel.hidden = true;
        const clusterCards = [];

        // Put the panel right after the row that holds the open cluster
        function placePanel() {
            if (openCluster === null) return;
            const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
            const rowEnd = Math.min(Math.floor(openCluster / cols) * cols + cols - 1, clusterCards.length - 1);
            clusterCards[rowEnd].after(panel);
            const r = clusterCards[openCluster].getBoundingClientRect();
            const p = grid.getBoundingClientRect();
            panel.style.setProperty('--tail-x', (r.left + r.width / 2 - p.left) + 'px');
        }

        function closeCluster() {
            if (openCluster === null) return;
            clusterCards[openCluster].querySelector('button').setAttribute('aria-expanded', 'false');
            panel.hidden = true;
            openCluster = null;
            closeBubble();
        }

        function openClusterAt(i) {
            closeCluster();
            const cluster = CLUSTERS[i];
            openCluster = i;
            clusterCards[i].querySelector('button').setAttribute('aria-expanded', 'true');

            panel.innerHTML = '';
            panel.style.setProperty('--panel-color', cluster.color);
            panel.setAttribute('aria-label', cluster.name + ' activities');
            const heading = document.createElement('h2');
            heading.textContent = cluster.name + ': choose an activity';
            const list = document.createElement('div');
            list.className = 'panel-grid';
            cluster.activities.forEach(a => list.appendChild(makeActivityCard(cluster, a)));
            panel.append(heading, list);
            panel.hidden = false;
            placePanel();
        }

        CLUSTERS.forEach((cluster, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            const btn = document.createElement('button');
            btn.className = 'btn-main btn-cluster';
            btn.style.backgroundColor = cluster.color;
            btn.textContent = cluster.name;
            if (cluster.activities) {
                const arrow = document.createElement('span');
                arrow.className = 'arrow';
                arrow.setAttribute('aria-hidden', 'true');
                arrow.textContent = '▼';
                btn.appendChild(arrow);
                btn.setAttribute('aria-expanded', 'false');
                btn.setAttribute('aria-controls', 'cluster-panel');
                btn.onclick = () => { if (openCluster === i) closeCluster(); else openClusterAt(i); };
            } else {
                btn.onclick = () => showToast('Coming soon!');
            }
            card.appendChild(btn);
            grid.appendChild(card);
            clusterCards.push(card);
        });
        grid.appendChild(panel);

        // Keep the bubble open while the mouse is over it (to reach the tutorial button)
        bubble.addEventListener('mouseenter', () => clearTimeout(hideTimer));
        bubble.addEventListener('mouseleave', closeSoon);

        // Touch: tapping outside closes the bubble
        document.addEventListener('click', (e) => {
            if (openCard && !bubble.contains(e.target) && !openCard.contains(e.target)) closeBubble();
        });
        // Escape closes the bubble first, then the open cluster
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (openCard) closeBubble();
            else if (openCluster !== null) {
                const btn = clusterCards[openCluster].querySelector('button');
                closeCluster();
                btn.focus();
            }
        });
        window.addEventListener('resize', () => {
            placePanel();
            if (openCard) positionBubble(openCard);
        });
    </script>

</body>
</html>
