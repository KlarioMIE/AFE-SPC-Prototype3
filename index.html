<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking-Practice Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Lexend', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            overflow-x: hidden;
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: clamp(2.25rem, 6vw, 4.5rem);
            font-weight: 900;
            color: #2563eb;
            letter-spacing: -0.04em;
            text-align: center;
            margin: 0 0 0.5rem;
        }

        .subtitle {
            font-size: clamp(1.25rem, 3vw, 1.875rem);
            font-weight: 700;
            font-style: italic;
            color: #1f2937;
            margin: 0 0 2.5rem;
            text-align: center;
        }

        /* Activity grid: 5 columns on laptops, 3 on tablets, 2 on phones */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 72rem;
        }
        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 560px)  { .grid { grid-template-columns: repeat(2, 1fr); } }

        .card { position: relative; }

        .btn-main {
            width: 100%;
            font-family: inherit;
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            font-weight: 900;
            color: #000;
            padding: 1.5rem 1rem;
            border: 3px solid #000;
            border-radius: 1.5rem;
            box-shadow: 0 6px 0 #000;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
        }
        .btn-main:hover { filter: brightness(1.1); }
        .btn-main:active { transform: translateY(3px); box-shadow: 0 3px 0 #000; }
        .btn-main:focus-visible { outline: 4px solid #2563eb; outline-offset: 3px; }

        /* Info icon: opens the bubble on touch screens (also works with a mouse) */
        .info-btn {
            position: absolute;
            top: -0.6rem;
            right: -0.6rem;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            border: 3px solid #000;
            background: #fff;
            font-family: Georgia, serif;
            font-size: 1.15rem;
            font-weight: 700;
            font-style: italic;
            cursor: pointer;
            z-index: 2;
        }
        .info-btn:focus-visible { outline: 4px solid #2563eb; outline-offset: 2px; }

        /* Floating speech bubble */
        .bubble {
            position: absolute;
            z-index: 10;
            width: min(22rem, calc(100vw - 2rem));
            background: #fff;
            border: 3px solid #000;
            border-radius: 1.25rem;
            box-shadow: 6px 6px 0 #000;
            padding: 1rem 1.1rem;
            display: none;
        }
        .bubble.open { display: block; }
        /* Tail of the bubble; its left offset is set from JS to point at the button */
        .bubble::before, .bubble::after {
            content: "";
            position: absolute;
            left: var(--tail-x, 50%);
            transform: translateX(-50%);
            border: 12px solid transparent;
        }
        .bubble.below::before { top: -27px; border-bottom-color: #000; }
        .bubble.below::after  { top: -21px; border-bottom-color: #fff; }
        .bubble.above::before { bottom: -27px; border-top-color: #000; }
        .bubble.above::after  { bottom: -21px; border-top-color: #fff; }

        .bubble h2 { margin: 0 0 0.4rem; font-size: 1.35rem; font-weight: 900; }
        .bubble p  { margin: 0 0 0.75rem; font-size: 1.05rem; line-height: 1.4; }
        .bubble .level {
            display: inline-block;
            font-weight: 900;
            font-size: 1rem;
            background: #000;
            color: #fde047;
            padding: 0.2rem 0.6rem;
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .tutorial-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 900;
            background: #ef4444;
            color: #fff;
            border: 3px solid #000;
            border-radius: 0.75rem;
            box-shadow: 0 4px 0 #000;
            padding: 0.5rem 0.9rem;
            cursor: pointer;
        }
        .tutorial-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }

        /* Short message for fake doors */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 1.5rem;
            transform: translateX(-50%);
            max-width: calc(100vw - 2rem);
            background: #000;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 0.9rem 1.4rem;
            border-radius: 1rem;
            z-index: 20;
            display: none;
            text-align: center;
        }
        .toast.show { display: block; }
    </style>
</head>
<body>

    <div class="app">
        <!-- SCREEN 1: WELCOME -->
        <h1>Speaking-Practice Center</h1>
        <p class="subtitle">Choose the type of activity here</p>
        <div id="activity-grid" class="grid"></div>
    </div>

    <div id="bubble" class="bubble" role="tooltip"></div>
    <div id="toast" class="toast" role="status"></div>

    <script>
        // Bubble texts and suggested CEFR levels come from
        // "Definición Actividades_SPC_Homepage - burbujas.docx" (Claudio, 2026-10-28).
        const ACTIVITIES = [
            { name: "Role-play", color: "#facc15", available: true, level: "B–C",
              text: "Students take on specific roles and act out simulated scenes or situations." },
            { name: "Debate", color: "#f472b6", level: "B–C",
              text: "A formal activity where teams defend opposing views on a controversial topic: first they plan as a team, then they interact with the other team." },
            { name: "Questionnaires", color: "#4ade80", level: "A+",
              text: "Students design or complete surveys to collect information from their classmates." },
            { name: "Dice", color: "#fb923c", level: "A+",
              text: "Rolling dice adds chance to speaking practice: the roll decides the topic to discuss or the grammar structure to use." },
            { name: "True/False", color: "#c084fc", level: "B–C",
              text: "Students hear or read statements and decide if they are true or false, asking questions and/or justifying their answer." },
            { name: "Interview", color: "#22d3ee", level: "A+",
              text: "One student gets specific information from another through prepared or spontaneous questions, in a given context." },
            { name: "Ranking", color: "#f87171", level: "A+",
              text: "A discussion where students put a list of items in order of importance or preference." },
            { name: "Problem Solv.", fullName: "Problem Solving", color: "#a3e635", level: "B–C",
              text: "Students work together to find a solution to a dilemma or a hypothetical situation." },
            { name: "Drawing", color: "#fbbf24", level: "A+",
              text: "Students draw from spoken instructions, or describe a picture for others to draw (\"describe and draw\")." },
            { name: "Jigsaw", color: "#2dd4bf", level: "A+",
              text: "A cooperative task where each student holds one piece of the information needed to complete it." },
            { name: "I'd rather", color: "#818cf8", level: "B–C",
              text: "Students express and explain their preferences between two options." },
            { name: "Guessing", color: "#34d399", level: "A+",
              text: "Students identify a person, object, word or situation through clues or yes/no questions." },
            { name: "Discussion", color: "#38bdf8", level: "B–C",
              text: "An exchange of ideas on a specific topic, in small groups or with the whole class." },
            { name: "T/F Trivia", color: "#fb7185", level: "B–C",
              text: "Students receive a statement about world issues, and they have to discuss and vote as a team whether it is true or false before time runs out." },
            { name: "More...", color: "#fef08a" }
        ];

        const grid = document.getElementById('activity-grid');
        const bubble = document.getElementById('bubble');
        const toast = document.getElementById('toast');
        let openCard = null;
        let hideTimer = null;
        let toastTimer = null;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function fillBubble(activity) {
            bubble.innerHTML = '';
            const title = document.createElement('h2');
            title.textContent = activity.fullName || activity.name;
            const text = document.createElement('p');
            text.textContent = activity.text;
            const level = document.createElement('div');
            level.className = 'level';
            level.textContent = 'Suggested CEFR level: ' + activity.level;
            // Fake door: the quick YouTube tutorial does not exist yet
            const tutorial = document.createElement('button');
            tutorial.className = 'tutorial-btn';
            tutorial.innerHTML = '<span aria-hidden="true">▶</span> Quick tutorial';
            tutorial.onclick = () => showToast('Video tutorial coming soon!');
            bubble.append(title, text, level, tutorial);
        }

        function positionBubble(card) {
            const r = card.getBoundingClientRect();
            const width = bubble.offsetWidth;
            const margin = 16;
            let left = r.left + r.width / 2 - width / 2;
            left = Math.max(margin, Math.min(left, window.innerWidth - width - margin));

            // Show below the button unless there is no room; then show above
            const spaceBelow = window.innerHeight - r.bottom;
            const below = spaceBelow > bubble.offsetHeight + 24 || r.top < bubble.offsetHeight + 24;
            bubble.classList.toggle('below', below);
            bubble.classList.toggle('above', !below);
            const top = below ? r.bottom + 18 : r.top - bubble.offsetHeight - 18;

            bubble.style.left = (left + window.scrollX) + 'px';
            bubble.style.top = (top + window.scrollY) + 'px';
            bubble.style.setProperty('--tail-x', (r.left + r.width / 2 - left) + 'px');
        }

        function openBubble(card, activity) {
            clearTimeout(hideTimer);
            fillBubble(activity);
            bubble.classList.add('open');
            positionBubble(card);
            openCard = card;
        }

        function closeBubble() {
            bubble.classList.remove('open');
            openCard = null;
        }

        function closeSoon() {
            clearTimeout(hideTimer);
            hideTimer = setTimeout(closeBubble, 200);
        }

        ACTIVITIES.forEach(activity => {
            const card = document.createElement('div');
            card.className = 'card';

            const btn = document.createElement('button');
            btn.className = 'btn-main';
            btn.style.backgroundColor = activity.color;
            btn.textContent = activity.name;
            btn.onclick = () => {
                if (activity.available) showToast('Next step: the Scenarios screen (in progress).');
                else showToast('Coming soon!');
            };
            card.appendChild(btn);

            if (activity.text) {
                const info = document.createElement('button');
                info.className = 'info-btn';
                info.textContent = 'i';
                info.setAttribute('aria-label', 'About ' + (activity.fullName || activity.name));
                info.onclick = (e) => {
                    e.stopPropagation();
                    if (openCard === card) closeBubble();
                    else openBubble(card, activity);
                };
                card.appendChild(info);

                // Mouse: open on hover. Keyboard: open on focus.
                card.addEventListener('pointerenter', (e) => {
                    if (e.pointerType !== 'touch') openBubble(card, activity);
                });
                card.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') closeSoon(); });
                btn.addEventListener('focus', () => openBubble(card, activity));
                btn.addEventListener('blur', closeSoon);
            }

            grid.appendChild(card);
        });

        // Keep the bubble open while the mouse is over it (to reach the tutorial button)
        bubble.addEventListener('mouseenter', () => clearTimeout(hideTimer));
        bubble.addEventListener('mouseleave', closeSoon);

        // Touch: tapping outside closes the bubble
        document.addEventListener('click', (e) => {
            if (openCard && !bubble.contains(e.target) && !openCard.contains(e.target)) closeBubble();
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBubble(); });
        window.addEventListener('resize', () => { if (openCard) positionBubble(openCard); });
    </script>
</body>
</html>
